<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>알고리즘 놀이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      img[src*="images-game-pixel"] {
        image-rendering: pixelated;
      }

      .pinky-algorithm-home-link {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 60;
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border: 1px solid rgba(216, 222, 232, 0.95);
        border-radius: 10px;
        color: #172033;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 12px 28px rgba(23, 32, 51, 0.14);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        font-size: 14px;
        font-weight: 900;
        line-height: 1;
        text-decoration: none;
        backdrop-filter: blur(10px);
      }

      .pinky-algorithm-home-link:hover {
        border-color: rgba(211, 22, 95, 0.34);
        color: #d3165f;
      }

      @media (max-width: 640px) {
        .pinky-algorithm-home-link {
          top: 10px;
          right: 10px;
          min-height: 34px;
          padding: 0 11px;
          font-size: 13px;
        }
      }

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
